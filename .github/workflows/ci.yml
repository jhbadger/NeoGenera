name: ci
on:
  push:
  pull_request:
  schedule:
    - cron: '17 3 * * *'

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build kernel
        run: make kernel
      - name: C unit tests
        run: make test-c
      - name: World (stage0, stage1, stage2, fixed point)
        run: make world
      - name: Lisp tests
        run: make test-lisp
      - name: Real-terminal (pty) tests
        run: make test-pty
      - name: Example gallery
        run: make examples
      - name: Conformance cases
        run: make conformance

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: C unit tests under ASan+UBSan
        run: SAN=1 sh tests/c/run.sh
      - name: Whole Lisp suite, fuzzers included, under ASan and UBSan
        run: make fuzz

  reproducible:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Two clean builds in different directories are identical
        run: make repro-check

  soak:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Ten-minute soak
        run: NG_SOAK_SECONDS=600 make soak
      - name: Benchmarks (informational)
        run: make bench

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tarball and Debian package
        run: make dist deb
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: |
            build/dist/*.tar.gz
            build/dist/SHA256SUMS
            build/deb/*.deb
